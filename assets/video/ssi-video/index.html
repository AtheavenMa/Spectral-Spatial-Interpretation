<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SSI · Data Drift · Ember</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="data/ssi-data.js"></script>
    <script src="data/ssi-math.js"></script>
    <script src="data/ssi-mask.js"></script>
    <style>
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-ExtraLight.otf") format("opentype");
        font-weight: 200;
      }
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-Light.otf") format("opentype");
        font-weight: 300;
      }
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-Regular.otf") format("opentype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-Medium.otf") format("opentype");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-SemiBold.otf") format("opentype");
        font-weight: 600;
      }
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-Bold.otf") format("opentype");
        font-weight: 700;
      }
      /* tokens: design.md (Data Drift, dark) */
      :root {
        --bg: #0a0a0a;
        --surface: #111518;
        --ink: #e3e9ec;
        --soft: #8b9aa2;
        --acc: #ff8a24;
        --indigo: #4f46e5;
        --pos: #ee7667;
        --neg: #4d91ca;
        --line: rgba(255, 255, 255, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Inter Display", sans-serif;
        color: var(--ink);
        line-height: 1.25;
        font-kerning: normal;
        font-feature-settings: "kern" 1, "calt" 1;
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .hide {
        opacity: 0;
      }
      .nowrap {
        white-space: nowrap;
      }
      .center {
        text-align: center;
      }
      .right {
        text-align: right;
      }
      .ink {
        color: var(--ink);
      }
      .acc {
        color: var(--acc);
      }
      .wi.acc {
        text-shadow: 0 0 30px rgba(255, 138, 36, 0.38);
      }
      .soft {
        color: var(--soft);
      }
      /* type roles (dark: one step lighter, a touch more air) */
      .title {
        font-weight: 300;
        letter-spacing: 0.004em;
        white-space: nowrap;
      }
      .label {
        font-weight: 500;
        letter-spacing: -0.005em;
      }
      .overline {
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-feature-settings: "case" 1, "kern" 1;
      }
      .fig {
        font-weight: 500;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums lining-nums;
        font-feature-settings: "tnum" 1, "lnum" 1, "kern" 1;
      }
      .wm {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0 0.04em 0.04em 0;
        margin-right: -0.04em;
      }
      .wi {
        display: inline-block;
      }
      /* glass panel */
      .glass {
        background: rgba(255, 255, 255, 0.035);
        border-radius: 26px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          0 24px 70px rgba(0, 0, 0, 0.55);
      }
      .plate {
        border-radius: 28px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 26px 80px rgba(0, 0, 0, 0.6);
      }
      .plate img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .comet {
        width: 160px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(255, 138, 36, 0), rgba(255, 196, 140, 0.95));
        box-shadow: 0 0 18px 3px rgba(255, 138, 36, 0.55);
      }
      svg {
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32.9"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <!-- atmosphere: canvas, radial glows, particle field, vignette, grain -->
      <div class="layer" data-layout-ignore style="background: var(--bg)"></div>
      <div id="glowA" class="abs" data-layout-ignore style="left: 1080px; top: -760px; width: 1500px; height: 1500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 138, 36, 0.17), rgba(255, 138, 36, 0))"></div>
      <div id="glowB" class="abs" data-layout-ignore style="left: -820px; top: 380px; width: 1500px; height: 1500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(79, 70, 229, 0.17), rgba(79, 70, 229, 0))"></div>
      <canvas id="field" class="abs" data-layout-ignore style="pointer-events: none" width="1920" height="1080"></canvas>
      <div class="layer" data-layout-ignore style="background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%)"></div>
      <div class="layer" data-layout-ignore style="background: url(assets/img/grain_dark.png) 0 0 / 1920px 1080px"></div>

      <!-- overline tag -->
      <div id="tag-dot" class="abs hide" style="left: 110px; top: 91px; width: 12px; height: 12px; border-radius: 6px; background: var(--acc); box-shadow: 0 0 12px rgba(255, 138, 36, 0.8)"></div>
      <div id="tag" class="abs overline nowrap soft" style="left: 136px; top: 80px; font-size: 24px">SSI<span id="tag-rest" style="display: inline-block">&nbsp;·&nbsp;Spectral–Spatial Interpretation</span></div>

      <div id="titles"></div>

      <!-- ===== beat 1 ===== -->

      <svg class="abs" width="1920" height="1080" viewBox="0 0 1920 1080">
        <g id="arrow1" fill="none" stroke="#4f5d65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path id="arrow1-line" d="M965 560 L1039 560" stroke-dasharray="80" stroke-dashoffset="80" />
          <path id="arrow1-head" d="M1026 548 L1040 560 L1026 572" opacity="0" />
        </g>
        <g id="arrow2" fill="none" stroke="#4f5d65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path id="arrow2-line" d="M1356 560 L1436 560" stroke-dasharray="85" stroke-dashoffset="85" />
          <path id="arrow2-head" d="M1423 548 L1437 560 L1423 572" opacity="0" />
        </g>
        <g id="arrow3" fill="none" stroke="#4f5d65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path id="arrow3-line" d="M1300 538 L1446 538" stroke-dasharray="150" stroke-dashoffset="150" />
          <path id="arrow3-head" d="M1433 527 L1447 538 L1433 549" opacity="0" />
        </g>
        <g id="arrow4" fill="none" stroke="#ff8a24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path id="arrow4-line" d="M612 565 L756 565" stroke-dasharray="150" stroke-dashoffset="150" />
          <path id="arrow4-head" d="M742 553 L757 565 L742 577" opacity="0" />
        </g>
      </svg>
      <div id="unet" class="abs glass hide" style="left: 1060px; top: 430px; width: 280px; height: 260px"></div>
      <div id="unet-glyph" class="layer"></div>
      <svg id="unet-arc" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080">
        <path id="unet-arc-path" d="M1094 520 A106 86 0 0 1 1306 528" stroke="#ff8a24" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="330" stroke-dashoffset="330" style="filter: drop-shadow(0 0 6px rgba(255, 138, 36, 0.7))" />
      </svg>
      <div id="unet-lbl" class="abs label center nowrap hide" style="left: 1050px; top: 620px; width: 300px; font-size: 38px">U-Net</div>
      <div id="fx" class="abs glass hide" style="left: 1460px; top: 430px; width: 350px; height: 260px">
        <div style="position: absolute; left: 117px; top: 34px; width: 116px; height: 116px; border-radius: 64px; background: rgba(255, 138, 36, 0.1); box-shadow: inset 0 0 0 3px #ff8a24, 0 0 30px rgba(255, 138, 36, 0.35)"></div>
        <div id="fx-math" class="acc center nowrap" style="position: absolute; left: 25px; top: 61px; width: 300px; font-size: 48px"></div>
        <div class="label center nowrap" style="position: absolute; left: 0; top: 178px; width: 350px; font-size: 30px">Burn-region logit</div>
      </div>

      <!-- ===== beat 2 ===== -->
      <div id="pills"></div>

      <!-- ===== beat 3 ===== -->
      <div id="lbl-observed" class="abs label right nowrap hide" style="left: 800px; top: 397px; width: 124px; font-size: 28px">Observed</div>
      <div id="lbl-masked" class="abs label right nowrap hide" style="left: 800px; top: 565px; width: 124px; font-size: 28px; line-height: 1.25"><div>Masked</div><div>at <span id="lbl-masked-g"></span></div></div>
      <div id="maskgrid"></div>
      <div id="mpanel" class="abs plate hide" style="left: 940px; top: 548px; width: 108px; height: 108px; border-radius: 14px">
        <div id="mpanel-fill" class="layer"></div>
        <div id="mflash" class="layer hide" style="background: radial-gradient(closest-side, rgba(255, 220, 190, 0.9), rgba(255, 138, 36, 0.3))"></div>
        <div style="position: absolute; inset: 5px; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.3)"></div>
      </div>
      <div id="ctx-pill" class="abs hide" style="left: 930px; top: 800px; width: 880px; height: 96px; border-radius: 26px; background: rgba(255, 138, 36, 0.07); box-shadow: inset 0 0 0 1.5px rgba(255, 138, 36, 0.4), 0 0 40px rgba(255, 138, 36, 0.12)">
        <div class="label acc center nowrap" style="position: absolute; left: 0; top: 20px; width: 880px; font-size: 44px; font-weight: 400; letter-spacing: 0.01em">Context stays fixed</div>
      </div>

      <!-- input tensor: six real spectral channels as a stacked cube (Fig. 2 style) -->
      <div id="stack" class="layer"></div>
      <div id="stack-ui" class="layer"></div>

      <!-- the observed image -->
      <div id="img" class="abs hide" style="width: 695px; height: 695px">
        <div class="layer plate"><img src="assets/img/input.png" alt="" /></div>
        <div id="patch" class="hide" style="position: absolute"></div>
        <div id="shock" class="hide" style="position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #ff8a24; box-shadow: 0 0 24px rgba(255, 138, 36, 0.9), inset 0 0 14px rgba(255, 138, 36, 0.6)"></div>
        <div id="gmark" class="layer hide">
          <div id="gbox" style="position: absolute; border: 4px solid #ff8a24; border-radius: 8px; box-shadow: inset 0 0 0 4px #ffffff, 0 0 22px rgba(255, 138, 36, 0.9)"></div>
          <svg id="gsvg" style="position: absolute; left: 0; top: 0" width="695" height="695" viewBox="0 0 695 695"></svg>
          <div id="glabel" class="ink nowrap" data-layout-allow-occlusion style="position: absolute; font-size: 54px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85))"></div>
        </div>
      </div>

      <!-- ===== beat 4 ===== -->
      <div id="lbl-loc" class="abs label center nowrap hide" style="left: 145px; top: 826px; width: 400px; font-size: 40px">Location <span id="lbl-loc-g"></span></div>
      <div id="lbl-orders" class="abs label nowrap hide" style="left: 800px; top: 300px; font-size: 42px">Five restoration orders</div>
      <div id="lbl-df" class="abs acc nowrap hide" style="top: 302px; font-size: 44px"></div>
      <div id="rows"></div>

      <!-- ===== beat 5 ===== -->
      <div id="zero5" class="abs hide" style="left: 778px; top: 318px; width: 3px; height: 640px; border-radius: 2px; background: rgba(255, 255, 255, 0.28)"></div>
      <div id="b5"></div>
      <div id="glbl5" class="abs ink nowrap hide" style="left: 1636px; top: 132px; font-size: 48px"></div>
      <div id="strip" class="abs hide" style="left: 496px; top: 960px; width: 927px; height: 44px; border-radius: 19px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08)"></div>

      <!-- ===== beat 6 ===== -->
      <div id="b6"></div>
      <div id="div6" class="abs hide" style="left: 110px; top: 868px; width: 1700px; height: 2px; background: var(--line)"></div>
      <div id="cap6" class="abs soft center nowrap hide" style="left: 560px; top: 896px; width: 800px; font-size: 40px; font-weight: 300; letter-spacing: 0.01em">Every position × every band</div>

      <!-- ===== beat 7 ===== -->
      <div id="lbl-where" class="abs overline acc nowrap hide" style="left: 110px; top: 316px; font-size: 30px">Where</div>
      <div id="lbl-which" class="abs overline acc nowrap hide" style="left: 880px; top: 316px; font-size: 30px">Which channels</div>
      <div id="base7" class="abs hide" style="left: 880px; top: 688px; width: 930px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.32)"></div>
      <div id="b7"></div>
      <div id="where" class="abs plate hide" style="left: 110px; top: 380px; width: 560px; height: 560px">
        <img src="assets/img/spatial_S_dark.png" alt="" />
      </div>
      <div id="lockup" class="abs hide" style="left: 1310px; top: 58px; width: 500px; text-align: right">
        <div class="acc nowrap" data-layout-allow-occlusion style="font-size: 120px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.08; text-shadow: 0 0 46px rgba(255, 138, 36, 0.5)">SSI</div>
        <div class="soft nowrap" data-layout-allow-occlusion style="font-size: 30px; font-weight: 400; letter-spacing: 0.01em">Spectral–Spatial Interpretation</div>
      </div>

      <!-- light traces along the connectors -->
      <div id="comets"></div>

      <!-- ===== persistent moving objects ===== -->
      <div id="segs"></div>
      <div id="tiles" class="layer"></div>
      <div id="crop" class="abs plate hide" style="width: 464px; height: 464px; border-radius: 34px"><img src="assets/img/g_observed.png" alt="" /></div>
      <div id="tokens"></div>
      <div id="t6b" class="abs acc nowrap hide" style="font-size: 83px"></div>
      <!-- effects: sparks canvas, laser, flare -->
      <div id="sparks"></div>
      <div id="laser" class="abs hide" data-layout-ignore style="pointer-events: none; left: 100px; top: 0; width: 1720px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(255, 138, 36, 0), #ff8a24 12%, #ffe2c4 50%, #ff8a24 88%, rgba(255, 138, 36, 0)); box-shadow: 0 0 22px 5px rgba(255, 138, 36, 0.65)"></div>
      <div id="bloom" class="abs hide" data-layout-ignore style="pointer-events: none; left: 1515px; top: -77px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 196, 140, 0.55), rgba(255, 138, 36, 0.18) 45%, rgba(255, 138, 36, 0))"></div>
      <div id="flare" class="abs hide" data-layout-ignore style="pointer-events: none; left: 1115px; top: 121px; width: 1200px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(255, 138, 36, 0), rgba(255, 196, 140, 0.9) 42%, #ffffff 50%, rgba(255, 196, 140, 0.9) 58%, rgba(255, 138, 36, 0)); box-shadow: 0 0 18px 4px rgba(255, 138, 36, 0.6)"></div>
      </div>
    </div>

    <script>
      (() => {
        const D = window.SSI_DATA;
        const M = window.SSI_MATH;
        const NAME = ["Blue", "Green", "Red", "NIR", "SWIR1", "SWIR2"];
        const FILE = ["blue", "green", "red", "nir", "swir1", "swir2"];
        const COL = ["#3277C8", "#27986F", "#DA5A58", "#8062B5", "#D59A3F", "#A45B45"];
        const POS = "#EE7667", NEG = "#4D91CA", ACC = "#FF8A24", BG = "#0A0A0A";
        const W = 1920, H = 1080;
        const $ = (id) => document.getElementById(id);
        const el = (parent, cls, style, html) => {
          const n = document.createElement("div");
          if (cls) n.className = cls;
          if (style) n.style.cssText = style;
          if (html !== undefined) n.innerHTML = html;
          parent.appendChild(n);
          return n;
        };
        const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        const mix = (hex, a, base = BG) => {
          const c = rgb(hex), b = rgb(base);
          return "rgb(" + c.map((v, k) => Math.round(b[k] * (1 - a) + v * a)).join(",") + ")";
        };
        const sgn = (v) => (v >= 0 ? POS : NEG);
        const fmt = (v, d) => (v < 0 ? "−" : "+") + Math.abs(v).toFixed(d);

        // ---------- TeX math (MathJax SVG), baseline-aligned ----------
        const MATH_SCALE = 1.12;
        const math = (key, px) => {
          const m = M[key], em = px * MATH_SCALE, [, y, w, h] = m.vb;
          return m.svg.replace("<svg ", `<svg width="${((w / 1000) * em).toFixed(2)}" height="${((h / 1000) * em).toFixed(2)}" style="vertical-align:${((-(h + y) / 1000) * em).toFixed(2)}px" `);
        };
        $("fx-math").innerHTML = math("fx", 48);
        $("glabel").innerHTML = math("g", 54);
        $("lbl-masked-g").innerHTML = math("g", 28);

        $("lbl-loc-g").innerHTML = math("g", 40);
        $("glbl5").innerHTML = math("g", 48);
        $("t6b").innerHTML = math("phi", 83);
        $("lbl-df").innerHTML = math("dfx", 44);
        $("lbl-df").style.left = (1570 + (5 * 33 + 22) / 2 - ((M.dfx.vb[2] / 1000) * 44 * MATH_SCALE) / 2).toFixed(1) + "px";

        // ---------- beat clock (25 s; the computational middle gets the extra time) ----------
        const T1 = 0, T2 = 6.0, T3 = 8.8, T4 = 14.2, T5 = 20.6, T6 = 24.0, T7 = 28.7, END = 32.9;

        // ---------- grid ----------
        const L = 110, R = 1810;
        const S23 = 680 / 695;
        const IMG = { b1: { x: L, y: 400, s: 460 / 695 }, b23: { x: L, y: 300, s: S23 } };
        const CELL = 695 / 16;
        const G = { row: D.g.row1 - 1, col: D.g.col1 - 1 };
        const gx = (G.col + 0.5) * CELL, gy = (G.row + 0.5) * CELL;
        const PILL_Y = (i) => 300 + i * 118.4;
        const ROW_Y = (k) => 372 + k * 122;
        const SLOT_X = (j) => 910 + j * 104;
        const ROW5 = (i) => 330 + i * 104;
        const ZERO = 780, BSCALE = 630 / D.phi_abs_max;
        const TILE_X = (i) => L + i * 286, TILE_Y = 392, TILE = 270;
        const CX7 = (i) => 957.5 + i * 155, BASE7 = 690;
        const maxP = Math.max(...D.spectral), maxN = Math.abs(Math.min(...D.spectral));
        const DMAX = Math.max(...D.deltas.flat().map(Math.abs));
        const WHERE = { x: L, y: 380, s: 560 / TILE };

        // ---------- titles ----------
        const TITLES = {
          t1: { top: 150, size: 88, lines: [[["Which channels matter,", "ink"], ["and where?", "acc"]]] },
          t2: { top: 150, size: 88, lines: [[["Six bands.", "ink"], ["One scene.", "acc"]]] },
          t3: { top: 150, size: 90, lines: [[["One patch changes.", "ink"]]] },
          t4: { top: 154, size: 78, lines: [[["Restore channels.", "ink"], ["Measure the change.", "acc"]]] },
          t5: { top: 156, size: 76, lines: [[["Sum", "acc"], ["to get six signed contributions.", "ink"]]] },
          t6: { top: 150, size: 88, lines: [[["One joint attribution.", "ink"]]] },
          t7: { top: 152, size: 84, lines: [[["One computation.", "ink"], ["Two views.", "acc"]]] },
        };
        const titleWords = {};
        for (const [id, T] of Object.entries(TITLES)) {
          const box = el($("titles"), "abs title", `left:${L}px;top:${T.top}px;font-size:${T.size}px`);
          box.id = id;
          box.innerHTML = T.lines
            .map((line) => "<div>" + line.map(([text, tone]) => text.split(" ").map((w) => `<span class="wm"><span class="wi ${tone}">${w}</span></span>`).join(" ")).join(" ") + "</div>")
            .join("");
          titleWords[id] = box.querySelectorAll(".wi");
        }

        // ---------- beat 1: U-Net glyph ----------
        const glyph = $("unet-glyph");
        const stacks = [];
        [110, 78, 52].forEach((h, k) => stacks.push(el(glyph, "abs", `left:${1084 + k * 48}px;top:${526 - h / 2}px;width:30px;height:${h}px;border-radius:12px;background:${mix(ACC, 0.22 + 0.16 * k, "#15191c")};opacity:0`)));
        [52, 78, 110].forEach((h, k) => stacks.push(el(glyph, "abs", `left:${1230 + k * 38}px;top:${526 - h / 2}px;width:26px;height:${h}px;border-radius:10px;background:${mix(ACC, 0.6 - 0.16 * k, "#15191c")};opacity:0`)));

        // ---------- g marker + baseline patch ----------
        const MB = 31;
        Object.assign($("gbox").style, { left: gx - MB + "px", top: gy - MB + "px", width: 2 * MB + "px", height: 2 * MB + "px" });
        $("gsvg").innerHTML =
          `<line x1="${gx + MB - 2}" y1="${gy - MB + 2}" x2="${gx + 58}" y2="${gy - 60}" stroke="${ACC}" stroke-width="3.5" stroke-linecap="round"/>` +
          `<circle cx="${gx + 63}" cy="${gy - 65}" r="6.5" fill="${ACC}"/>`;
        Object.assign($("glabel").style, { left: gx + 78 + "px", top: gy - 112 + "px" });
        Object.assign($("patch").style, { left: G.col * CELL + "px", top: G.row * CELL + "px", width: CELL + "px", height: CELL + "px", background: D.baseline_display_hex });

        };
        const tok = (i, a, b, at, dur, ease = "power3.inOut") => {
          to(tokFace[i], { clipPath: clip(a) }, { clipPath: clip(b) }, at, dur, ease);
          to(tokVeil[i], { clipPath: clip(shrink(a, 4)) }, { clipPath: clip(shrink(b, 4)) }, at, dur, ease);
        };
        const seg = (i, a, b, at, dur, extraFrom = {}, extraTo = {}, ease = "power3.inOut") =>
          to(segs[i], Object.assign({ clipPath: clip(a) }, extraFrom), Object.assign({ clipPath: clip(b) }, extraTo), at, dur, ease);

        // ---------------- initial states ----------------
        Object.values(titleWords).forEach((ws) => tl.set(ws, { yPercent: 118, opacity: 0 }, 0));
        tl.set($("tag"), { clipPath: "inset(0% 100% 0% 0%)" }, 0);
        tl.set($("tag-rest"), { clipPath: "inset(0% 0% 0% 0%)" }, 0);
        tl.set($("progress"), { scaleX: 0, transformOrigin: "0% 50%" }, 0);
        tl.set($("img"), { x: IMG.b23.x, y: IMG.b23.y, scale: IMG.b23.s, transformOrigin: "0 0" }, 0);
        for (let k = 0; k < 6; k++) {
          tl.set(mObs[k], { x: MCOL(0), y: MROW1 }, 0);
          tl.set(mMask[k], { x: MCOL(k + 1), y: MROW1 }, 0);
        }
        for (let i = 0; i < 6; i++) {
          tl.set(lPos[i], { x: SC.cx - SC.size / 2, y: CYs(i) - SC.size / 2, scale: 1, transformOrigin: "50% 50%" }, 0);
          tl.set(lTilt[i], { rotationX: SC.tilt, transformOrigin: "50% 50%" }, 0);
          tl.set(lSpin[i], { rotation: SC.spin, transformOrigin: "50% 50%" }, 0);
          tl.set(lGrid[i], { clipPath: "inset(0% 100% 0% 0%)" }, 0);
        }
        tl.set($("crop"), { x: IMG.b23.x + G.col * CELL * S23, y: IMG.b23.y + G.row * CELL * S23, scale: (CELL * S23) / 464, transformOrigin: "0 0" }, 0);
        for (let i = 0; i < 6; i++) {
          tl.set(tokFace[i], { clipPath: clip(tkStack(i)) }, 0);
          tl.set(tokVeil[i], { clipPath: clip(shrink(tkStack(i), 4)) }, 0);
          tl.set(segs[i], { clipPath: clip(sgBar0(i)) }, 0);
          tl.set(tiles[i], { x: TILE_X(i), y: TILE_Y, scale: 1, transformOrigin: "50% 50%" }, 0);
          tl.set(tTilt[i], { rotationX: 0, transformOrigin: "50% 50%" }, 0);
          tl.set(tSpin[i], { rotation: 0, transformOrigin: "50% 50%" }, 0);
          tl.set(heats[i], { clipPath: "inset(0% 0% 100% 0%)" }, 0);
          tl.set(bars7[i], { scaleY: 0, transformOrigin: bars7[i].dataset.origin }, 0);
        }
        tl.set($("t6b"), { x: 1450, y: 955, scale: 44 / 83, transformOrigin: "0 0" }, 0);

        // ambient for the whole film
        const fieldClock = { t: 0 };
        to(fieldClock, { t: 0 }, { t: END, onUpdate: () => { drawField(fieldClock.t); drawFx(fieldClock.t); } }, 0, END, "none");
        // floating camera: a slow, bounded drift of the whole foreground
        tl.set($("stage"), { transformOrigin: "50% 50%" }, 0);
        [
          [0, 7, { x: 0, y: 0, scale: 1 }, { x: -10, y: 6, scale: 1.012 }],
          [7, 9, { x: -10, y: 6, scale: 1.012 }, { x: 8, y: -5, scale: 1.004 }],
          [16, 8, { x: 8, y: -5, scale: 1.004 }, { x: -6, y: 4, scale: 1.014 }],
          [24, 8.9, { x: -6, y: 4, scale: 1.014 }, { x: 0, y: -2, scale: 1.006 }],
        ].forEach(([at, dur, a, b]) => to($("stage"), a, b, at, dur, "sine.inOut"));
        to($("glowA"), { x: 0, y: 0, scale: 1 }, { x: -90, y: 60, scale: 1.08 }, 0, END, "sine.inOut");
        to($("glowB"), { x: 0, y: 0, scale: 1.05 }, { x: 110, y: -50, scale: 0.97 }, 0, END, "sine.inOut");
        to($("progress"), { scaleX: 0 }, { scaleX: 1 }, 0, END, "none");

        // ================= BEAT 1 (0 – 6.0 s): the input = six spectral channels c × one spatial grid g =================
        fadeIn($("tag-dot"), T1 + 0.15, 0.4);
        to($("tag"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)" }, T1 + 0.2, 0.8, "power3.out");
        titleIn("t1", T1 + 0.25);
        // channels settle onto the stack bottom-up, each with its c_k label and colour token
        for (let i = 5; i >= 0; i--) {
          const at = T1 + 0.45 + (5 - i) * 0.14;
          to(lPos[i], { opacity: 0, y: CYs(i) - SC.size / 2 - 70 }, { opacity: 1, y: CYs(i) - SC.size / 2 }, at, 0.75, "expo.out");
          to(labLayer[i], { opacity: 0, x: -14 }, { opacity: 1, x: 0 }, at + 0.15, 0.5, "expo.out");
          to(tokWrap[i], { opacity: 0 }, { opacity: 1 }, at + 0.15, 0.3, "none");
        }
        arrive($("cap-hls"), T1 + 1.0, 0.6, 10);
        to($("brC"), { strokeDashoffset: brC.y2 - brC.y1 + 28 }, { strokeDashoffset: 0 }, T1 + 1.35, 0.55, "power2.inOut");
        to(labC, { opacity: 0, x: 16 }, { opacity: 1, x: 0 }, T1 + 1.5, 0.6, "expo.out");
        // one 16 × 16 spatial grid, shared by every channel
        lGrid.forEach((g, i) => {
          to(g, { opacity: 0 }, { opacity: 1 }, T1 + 1.85 + i * 0.05, 0.3, "none");
          to(g, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)" }, T1 + 1.85 + i * 0.05, 0.7, "power2.inOut");
        });
        to($("brG"), { strokeDashoffset: brG.x2 - brG.x1 + 28 }, { strokeDashoffset: 0 }, T1 + 2.2, 0.55, "power2.inOut");
        to(labG, { opacity: 0, y: 14 }, { opacity: 1, y: 0 }, T1 + 2.35, 0.6, "expo.out");
        // one cell g holds all six channels: light it on every layer, join with a column
        for (let i = 0; i < 6; i++) to($("gcell" + i), { opacity: 0 }, { opacity: 1 }, T1 + 2.8 + i * 0.07, 0.25, "power2.out");
        to($("pillar"), { opacity: 0, strokeDashoffset: 0 }, { opacity: 1, strokeDashoffset: -42 }, T1 + 2.85, 0.6, "power2.out");
        // that input goes to the U-Net, which returns one fixed scalar target
        draw("a1", $("arrow1-line"), $("arrow1-head"), 80, T1 + 3.55, 0.4);
        to($("unet"), { opacity: 0, scaleY: 0.04, scaleX: 0.86 }, { opacity: 1, scaleY: 1, scaleX: 1 }, T1 + 3.8, 0.6, "expo.out");
        stacks.forEach((st, k) => to(st, { opacity: 0, scaleY: 0.08 }, { opacity: 1, scaleY: 1 }, T1 + 3.95 + k * 0.06, 0.45, "back.out(1.6)"));
        to($("unet-arc-path"), { strokeDashoffset: 330 }, { strokeDashoffset: 0 }, T1 + 4.05, 0.6, "sine.inOut");
        arrive($("unet-lbl"), T1 + 4.2, 0.55, 10);
        draw("a2", $("arrow2-line"), $("arrow2-head"), 85, T1 + 4.45, 0.4);
        to($("fx"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1 }, T1 + 4.75, 0.6, "back.out(1.4)");
        const b1out = [$("cap-hls"), $("arrow1"), $("arrow2"), $("unet"), $("unet-glyph"), $("unet-arc"), $("unet-lbl"), $("fx"), labC, labG, ...labLayer, $("brC"), $("brG"), $("pillar")];
        to(b1out, { opacity: 1 }, { opacity: 0 }, T2 - 0.3, 0.34, "power2.in");
        for (let i = 0; i < 6; i++) leave($("gcell" + i), T2 - 0.3, 0.34);
        titleOut("t1", T2 - 0.26);
        to($("tag-rest"), { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)" }, T2 - 0.2, 0.6, "power3.inOut");

        // ================= BEAT 2 (6.0 – 8.8 s): six bands, one scene =================
        titleIn("t2", T2 + 0.08);
        // the stack flattens: six co-registered channels become the one observed scene
        lGrid.forEach((g) => leave(g, T2 - 0.1, 0.4));
        for (let i = 0; i < 6; i++) {
          const at = T2 + (5 - i) * 0.05;
          to(lPos[i], { x: SC.cx - SC.size / 2, y: CYs(i) - SC.size / 2, scale: 1 }, { x: IMG.b23.x + 340 - SC.size / 2, y: IMG.b23.y + 340 - SC.size / 2, scale: 680 / SC.size }, at, 0.9, "power3.inOut");
          to(lTilt[i], { rotationX: SC.tilt }, { rotationX: 0 }, at, 0.9, "power3.inOut");
          to(lSpin[i], { rotation: SC.spin, borderRadius: 8 }, { rotation: 0, borderRadius: 28 / (680 / SC.size) }, at, 0.9, "power3.inOut");
        }
        fadeIn($("img"), T2 + 0.78, 0.45);
        tl.set(lPos, { opacity: 0 }, T2 + 1.25);
        to($("gmark"), { opacity: 0, scale: 0.55, transformOrigin: `${gx}px ${gy}px` }, { opacity: 1, scale: 1 }, T2 + 1.1, 0.5, "back.out(2)");
        for (let i = 0; i < 6; i++) {
          const at = T2 + 0.5 + i * 0.14;
          to(pills[i], { opacity: 0, x: 900 }, { opacity: 1, x: 0 }, at, 0.85, "expo.out");
          tok(i, tkStack(i), tkPill(i), at, 0.85, "expo.out");
          to(sheens[i], { x: -220 }, { x: 900 }, at + 0.45, 0.8, "power2.inOut");
        }
        titleOut("t2", T3 - 0.25);

        // ================= BEAT 3 (8.8 – 13.0 s): what "masked at g" means =================
        titleIn("t3", T3 + 0.08);
        to(pills, { opacity: 1, x: 0 }, { opacity: 0, x: 48 }, T3, 0.36, "power2.in");
        for (let i = 0; i < 6; i++) tok(i, tkPill(i), tkDock(i), T3 + 0.05 + i * 0.06, 0.9);
        // pull cell g out of the scene ...
        to($("crop"), { opacity: 0, x: IMG.b23.x + G.col * CELL * S23, y: IMG.b23.y + G.row * CELL * S23, scale: (CELL * S23) / 464 }, { opacity: 1, x: MCOL(0), y: MROW1, scale: MTS / 464 }, T3 + 0.3, 0.85, "expo.out");
        mHead.forEach((h, k) => to(h, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, T3 + 0.6 + k * 0.05, 0.5, "expo.out"));
        // ... and split it into its six channels (real 8 × 8 values of each band)
        mObs.forEach((o, k) => to(o, { opacity: 0, x: MCOL(0) }, { opacity: 1, x: MCOL(k + 1) }, T3 + 0.75 + k * 0.1, 0.85, "expo.out"));
        arrive($("lbl-observed"), T3 + 1.3, 0.55, 8);
        // MASK: every channel of g drops to its mean value; all six together
        const TM = T3 + 2.35;
        mMask.forEach((m, k) => {
          const at = TM + k * 0.08;
          tl.set(m, { opacity: 1 }, at);
          to(m, { y: MROW1 }, { y: MROW2 }, at, 1.0, "power3.inOut");
          to(mMaskTex[k], { opacity: 1 }, { opacity: 0 }, at + 0.25, 0.8, "power2.inOut");
          to(tokVeil[k], { opacity: 0 }, { opacity: 1 }, at + 0.6, 0.25, "none");
        });
        arrive($("lbl-masked"), TM + 0.3, 0.55, 8);
        // the RGB view of the masked cell, and the same patch in the scene
        const TP = TM + 1.3;
        to($("mpanel"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1 }, TP, 0.45, "back.out(1.6)");
        to($("mflash"), { opacity: 0.9 }, { opacity: 0 }, TP, 0.45, "power2.out");
        fadeIn($("patch"), TP, 0.25, "none");
        to($("shock"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 7 }, TP, 0.75, "power2.out");
        burst("mask", TP, IMG.b23.x + gx * S23, IMG.b23.y + gy * S23, "#ffb46b", 20, 300, 0.7);
        tl.set(PADS.mask.c, { opacity: 1 }, TP - 0.02);
        tl.set(PADS.mask.c, { opacity: 0 }, TP + 0.72);
        to($("ctx-pill"), { opacity: 0, scaleX: 0.96 }, { opacity: 1, scaleX: 1 }, TP + 0.7, 0.6, "expo.out");
        titleOut("t3", T4 - 0.25);

        // ================= BEAT 4 (8.4 – 12.6 s): restore channels, measure the change =================
        titleIn("t4", T4 + 0.08);
        leave([$("img"), $("lbl-observed"), $("lbl-masked"), $("mpanel"), $("ctx-pill"), ...mHead, ...mObs, ...mMask], T4 - 0.05, 0.35);
        to($("crop"), { x: MCOL(0), y: MROW1, scale: MTS / 464 }, { x: L, y: 330, scale: 470 / 464 }, T4 + 0.05, 0.75, "power3.inOut");
        arrive($("lbl-loc"), T4 + 0.55, 0.6, 10);
        draw("a4", $("arrow4-line"), $("arrow4-head"), 150, T4 + 0.6, 0.38);
        arrive($("lbl-orders"), T4 + 0.2, 0.6, 12);
        arrive($("lbl-df"), T4 + 0.3, 0.6, 12);
        rows.forEach((r, k) => to([r, nums[k]], { opacity: 0, x: 28 }, { opacity: 1, x: 0 }, T4 + 0.2 + k * 0.06, 0.55, "expo.out"));
        for (let i = 0; i < 6; i++) tok(i, tkDock(i), tkRow(0, i), T4 + 0.1, 0.65);
        // first order slowly (one channel at a time), then each later order a little quicker
        const RUN = [
          { at: T4 + 0.9, move: 0, step: 0.26, pulse: 0.5 },
          { at: T4 + 2.6, move: 0.26, step: 0.11, pulse: 0.36 },
          { at: T4 + 3.7, move: 0.22, step: 0.095, pulse: 0.32 },
          { at: T4 + 4.65, move: 0.2, step: 0.085, pulse: 0.3 },
          { at: T4 + 5.5, move: 0.18, step: 0.075, pulse: 0.28 },
        ];
        RUN.forEach((run, k) => {
          if (k > 0) {
            for (let i = 0; i < 6; i++) tok(i, tkRow(k - 1, i), tkRow(k, i), run.at, run.move, "power2.inOut");
            tokVeil.forEach((v) => to(v, { opacity: 0 }, { opacity: 1 }, run.at, 0.06, "none"));
            ghosts[k - 1].forEach((g) => to(g, { opacity: 0 }, { opacity: 0.34 }, run.at, 0.14, "none"));
          }
          D.orders[k].forEach((band, j) => {
            const at = run.at + run.move + j * run.step;
            const dv = D.deltas[k][j];
            const r = tkRow(k, band);
            to(tokVeil[band], { opacity: 1 }, { opacity: 0 }, at, 0.06, "none");
            to(tokWrap[band], { scale: 1.14, transformOrigin: `${r.x + 30}px ${r.y + 30}px` }, { scale: 1 }, at, 0.26, "back.out(2)");
            to(pulses[k][j], { opacity: 0.95, scale: 1 }, { opacity: 0, scale: 1.15 + (1.3 * Math.abs(dv)) / DMAX }, at, run.pulse, "power2.out");
            to(ticks[k][j], { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1 }, at, 0.18, "power3.out");
            if (k === 0) burst("run", at, r.x + 30, r.y + 30, sgn(dv), 14, 220, 0.55);
          });
        });
        tl.set(PADS.run.c, { opacity: 1 }, RUN[0].at - 0.02);
        tl.set(PADS.run.c, { opacity: 0 }, RUN[0].at + 5 * RUN[0].step + 0.58);
        titleOut("t4", T5 - 0.25);

        // ================= BEAT 5 (12.6 – 16.0 s): six signed contributions =================
        titleIn("t5", T5 + 0.08);
        leave([$("lbl-loc"), $("arrow4"), $("lbl-orders"), $("lbl-df"), ...rows, ...nums, ...ghosts.flat(), ...ticks.flat()], T5, 0.35);
        to($("crop"), { x: L, y: 330, scale: 470 / 464 }, { x: 1680, y: 108, scale: 130 / 464 }, T5, 0.7, "power3.inOut");
        arrive($("glbl5"), T5 + 0.35, 0.5, 8);
        for (let i = 0; i < 6; i++) tok(i, tkRow(4, i), tkDot(i), T5 + i * 0.04, 0.75);
        to($("zero5"), { opacity: 0, scaleY: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleY: 1 }, T5 + 0.15, 0.5, "expo.out");
        names5.forEach((n, i) => to(n, { opacity: 0, x: -18 }, { opacity: 1, x: 0 }, T5 + 0.25 + i * 0.05, 0.5, "expo.out"));
        segs.forEach((s, i) => {
          tl.set(s, { opacity: 1 }, T5 + 0.38);
          seg(i, sgBar0(i), sgBar(i), T5 + 0.4 + i * 0.06, 0.8, {}, {}, "power3.out");
          fadeIn(vals5[i], T5 + 0.4 + i * 0.06, 0.3);
          countUp(vals5[i], D.local[i], 4, T5 + 0.4 + i * 0.06, 0.8);
          const end = D.local[i] >= 0 ? ZERO + Math.abs(D.local[i]) * BSCALE - 8 : ZERO - Math.abs(D.local[i]) * BSCALE - 8;
          to(heads5[i], { x: ZERO - 8 }, { x: end }, T5 + 0.4 + i * 0.06, 0.8, "power3.out");
          to(heads5[i], { opacity: 0 }, { opacity: 1 }, T5 + 0.4 + i * 0.06, 0.12, "none");
          to(heads5[i], { opacity: 1 }, { opacity: 0 }, T5 + 0.4 + i * 0.06 + 0.55, 0.45, "power2.out");
        });
        // hold ~1 s on the six real values, then contract them (band order) into Φ(g, c)
        leave([...names5, ...vals5, $("zero5")], T6 - 0.9, 0.3);
        fadeIn($("strip"), T6 - 0.85, 0.35);
        segs.forEach((s, i) => seg(i, sgBar(i), sgStrip(i), T6 - 0.88 + i * 0.04, 0.6, { backgroundColor: sgn(D.local[i]) }, { backgroundColor: mix(COL[i], 0.4) }));
        for (let i = 0; i < 6; i++) tok(i, tkDot(i), tkTab(i), T6 - 0.88 + i * 0.04, 0.6);
        fadeIn($("t6b"), T6 - 0.5, 0.35);
        titleOut("t5", T6 - 0.25);
        leave([$("crop"), $("glbl5")], T6 - 0.35, 0.3);

        // ================= BEAT 6 (16.0 – 20.8 s): one joint attribution =================
        titleIn("t6", T6 + 0.08);
        to($("t6b"), { x: 1450, y: 955, scale: 44 / 83 }, { x: L, y: 260, scale: 1 }, T6, 0.9, "power3.inOut");
        leave($("strip"), T6, 0.4);
        segs.forEach((s, i) => {
          const at = T6 + 0.05 + i * 0.07;
          seg(i, sgStrip(i), sgTile(i), at, 1.0, { backgroundColor: mix(COL[i], 0.4) }, { backgroundColor: "#16191b" });
          fadeIn(tiles[i], at + 0.7, 0.45);
          tl.set(s, { opacity: 0 }, at + 1.16);
          tok(i, tkTab(i), tkRule(i), at, 1.0);
          to(names6[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, T6 + 0.8 + i * 0.05, 0.55, "expo.out");
        });
        // the local game repeated over all positions: one grid row of 16 cells per step
        heats.forEach((h) => to(h, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)" }, T6 + 1.3, 1.8, "steps(16)"));
        to($("laser"), { y: TILE_Y - 2 }, { y: TILE_Y + TILE - 2 }, T6 + 1.3, 1.8, "none");
        to($("laser"), { opacity: 0 }, { opacity: 1 }, T6 + 1.25, 0.15, "none");
        const TC = T6 + 3.12; // the scan reaches the last grid row
        to($("laser"), { opacity: 1, scaleY: 1, transformOrigin: "50% 50%" }, { opacity: 0, scaleY: 5 }, T6 + 3.06, 0.38, "power2.out");
        tiles.forEach((t, i) => {
          const at = TC + i * 0.06;
          to(doneFlash[i], { opacity: 0 }, { opacity: 1 }, at, 0.12, "power2.out");
          to(doneFlash[i], { opacity: 1 }, { opacity: 0 }, at + 0.12, 0.5, "power2.in");
          to(doneSheen[i], { opacity: 1, x: -130 }, { opacity: 1, x: TILE + 30 }, at, 0.5, "power2.inOut");
          to(tSpin[i], { boxShadow: "0 0 0 1px rgba(255,255,255,0.1), 0 26px 80px rgba(0,0,0,0.6)" }, { boxShadow: "0 0 0 2px rgba(255,196,140,0.95), 0 0 56px rgba(255,138,36,0.7)" }, at, 0.16, "power2.out");
          to(tSpin[i], { boxShadow: "0 0 0 2px rgba(255,196,140,0.95), 0 0 56px rgba(255,138,36,0.7)" }, { boxShadow: "0 0 0 1px rgba(255,255,255,0.1), 0 26px 80px rgba(0,0,0,0.6)" }, at + 0.16, 0.6, "power2.inOut");
          burst("scan", at + 0.04, TILE_X(i) + TILE / 2, TILE_Y + TILE / 2, "#ffc48c", 12, 200, 0.5);
        });
        tl.set(PADS.scan.c, { opacity: 1 }, TC - 0.02);
        tl.set(PADS.scan.c, { opacity: 0 }, TC + 5 * 0.06 + 0.6);
        to($("div6"), { opacity: 0, scaleX: 0, transformOrigin: "50% 50%" }, { opacity: 1, scaleX: 1 }, T6 + 1.0, 0.7, "expo.out");
        arrive($("cap6"), T6 + 1.4, 0.7, 12);
        titleOut("t6", T7 - 0.3);
        leave([$("t6b"), ...names6, $("div6"), $("cap6")], T7 - 0.3, 0.34);

        // ================= BEAT 7 (20.8 – 25 s): one computation, two views =================
        titleIn("t7", T7 + 0.08);
        // geometry: the same orthographic stack as beat 1, centred on the WHERE panel
        const WCX = WHERE.x + 280, WCY = WHERE.y + 280; // centre of the final map
        const ISO = { s: 1.36, tilt: SC.tilt, spin: SC.spin, gap: 48 };
        const isoY = (i) => WCY + (i - 2.5) * ISO.gap;
        const atPos = (cx, cy, sc) => ({ x: cx - TILE / 2, y: cy - TILE / 2, scale: sc });
        tl.set(sumPos, atPos(WCX, WCY, ISO.s), 0);
        tl.set(sumTilt, { rotationX: ISO.tilt, transformOrigin: "50% 50%" }, 0);
        tl.set(sumSpin, { rotation: ISO.spin, borderRadius: 24, transformOrigin: "50% 50%" }, 0);
        // 1 — the six maps glide into a stack (left to right, one continuous move each)
        tiles.forEach((t, i) => {
          const at = T7 + i * 0.07, d = 1.05;
          to(t, atPos(TILE_X(i) + TILE / 2, TILE_Y + TILE / 2, 1), atPos(WCX, isoY(i), ISO.s), at, d, "power3.inOut");
          to(tTilt[i], { rotationX: 0 }, { rotationX: ISO.tilt }, at, d, "power3.inOut");
          to(tSpin[i], { rotation: 0 }, { rotation: ISO.spin }, at, d, "power3.inOut");
        });
        // 2 — Σ over c: the layers close up into one, and S(g) appears on that same layer
        const TS = T7 + 1.5;
        tiles.forEach((t, i) => to(t, atPos(WCX, isoY(i), ISO.s), atPos(WCX, WCY, ISO.s), TS, 0.55, "power3.inOut"));
        to(sumPos, { opacity: 0 }, { opacity: 1 }, TS + 0.25, 0.35, "sine.inOut");
        to(sumSpin, { boxShadow: "0 0 0 1px rgba(255,255,255,0.1), 0 26px 80px rgba(0,0,0,0.6)" }, { boxShadow: "0 0 0 2px rgba(255,196,140,0.95), 0 0 70px rgba(255,138,36,0.75)" }, TS + 0.4, 0.2, "power2.out");
        to(sumSpin, { boxShadow: "0 0 0 2px rgba(255,196,140,0.95), 0 0 70px rgba(255,138,36,0.75)" }, { boxShadow: "0 0 0 1px rgba(255,255,255,0.1), 0 26px 80px rgba(0,0,0,0.6)" }, TS + 0.6, 0.7, "power2.inOut");
        tl.set(tiles, { opacity: 0 }, TS + 0.62);
        // 3 — the summed layer turns face-on and settles as the WHERE map
        const TF = TS + 0.65;
        to(sumPos, atPos(WCX, WCY, ISO.s), atPos(WCX, WCY, 560 / TILE), TF, 0.9, "power3.inOut");
        to(sumTilt, { rotationX: ISO.tilt }, { rotationX: 0 }, TF, 0.9, "power3.inOut");
        to(sumSpin, { rotation: ISO.spin, borderRadius: 24 }, { rotation: 0, borderRadius: 28 / (560 / TILE) }, TF, 0.9, "power3.inOut");
        arrive($("lbl-where"), TF + 0.55, 0.6, 12);
        // Σ over g: each band map becomes one total — the chart starts once the maps have left
        arrive($("lbl-which"), T7 + 1.0, 0.6, 12);
        to($("base7"), { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1 }, T7 + 1.0, 0.8, "expo.out");
        for (let i = 0; i < 6; i++) tok(i, tkRule(i), tkBar(i), T7 + 0.1 + i * 0.07, 1.05);
        bars7.forEach((bar, i) => {
          tl.set(bar, { opacity: 1 }, T7 + 1.25 + i * 0.08);
          to(bar, { scaleY: 0 }, { scaleY: 1 }, T7 + 1.25 + i * 0.08, 0.9, "power4.out");
        });
        names7.forEach((n, i) => to(n, { opacity: 0, y: 8 }, { opacity: 1, y: 0 }, T7 + 1.4 + i * 0.05, 0.5, "expo.out"));
        [4, 5].forEach((i) => {
          fadeIn(vals7[i], T7 + 1.75 + (i - 4) * 0.08, 0.35);
          countUp(vals7[i], D.spectral[i], 3, T7 + 1.75 + (i - 4) * 0.08, 1.0);
        });
        // SSI revealed in the final half second
        to($("lockup"), { opacity: 0, y: 28, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)" }, END - 0.62, 0.55, "expo.out");
        to($("flare"), { opacity: 0, scaleX: 0.05, transformOrigin: "50% 50%" }, { opacity: 1, scaleX: 1 }, END - 0.6, 0.22, "expo.out");
        to($("flare"), { opacity: 1 }, { opacity: 0 }, END - 0.36, 0.3, "power2.out");
        to($("bloom"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1 }, END - 0.6, 0.2, "expo.out");
        to($("bloom"), { opacity: 1 }, { opacity: 0.18 }, END - 0.4, 0.35, "power2.out");
        burst("ssi", END - 0.58, 1715, 123, "#ffb46b", 22, 380, 0.5);
        tl.set(PADS.ssi.c, { opacity: 1 }, END - 0.6);
        tl.set(PADS.ssi.c, { opacity: 0 }, END - 0.06);

        window.__timelines["main"] = tl;
      })();
    </script>
