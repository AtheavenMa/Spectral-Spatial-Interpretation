name: Real browser SSI HTML

on:
  push:
    paths:
      - 'docs/playground/**'
      - 'tools/test_browser_web.py'
      - '.github/workflows/web-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless browser
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Test live ONNX inference and SSI in standalone HTML
        run: python tools/test_browser_web.py
      - name: Test the public GitHub Pages Playground
        env:
          SSI_WEB_URL: https://atheavenma.github.io/ssi-playground/
        run: python tools/test_browser_web.py
      - name: Save internal browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-ssi-browser-smoke
          path: |
            /tmp/ssi_web_desktop.png
            /tmp/ssi_web_mobile.png
            /tmp/ssi_web_gallery.png
          if-no-files-found: ignore
