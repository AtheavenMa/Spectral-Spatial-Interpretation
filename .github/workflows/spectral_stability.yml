name: Hyperspectral Sampling Stability
on:
  workflow_dispatch:
  push:
    paths:
      - 'ssi.py'
      - 'lab/engine.py'
      - 'lab/adapters/**'
      - 'benchmarks/spectral_stability.py'
      - 'assets/checkpoints/**'
      - 'assets/samples/**'
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install model and analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Measure real hyperspectral sampling sensitivity
        run: python benchmarks/spectral_stability.py --second-seed --output /tmp/ssi_spectral_stability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssi-spectral-stability
          path: /tmp/ssi_spectral_stability.json
          if-no-files-found: ignore
