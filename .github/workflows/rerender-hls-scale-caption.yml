name: Re-render HLS without scale caption
on:
  push:
    paths:
      - ".github/workflows/rerender-hls-scale-caption.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "matplotlib>=3.8,<4"
      - name: Render figure with existing numerical results
        run: python -m tools.render_hls_showcase
      - name: Commit only regenerated HLS PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/HLS_BurnScars/sample_0163_mean_g16_k5.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: remove shared scale caption from HLS showcase"
            git push origin HEAD:fix/remove-shared-scale-caption
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hls-without-caption
          path: examples/HLS_BurnScars/sample_0163_mean_g16_k5.png
          if-no-files-found: error
