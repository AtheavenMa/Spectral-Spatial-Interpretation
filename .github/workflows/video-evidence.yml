name: Generate SSI Video Evidence

on:
  push:
    paths:
      - "tools/export_video_hls_0163.py"
      - ".github/workflows/video-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and image dependencies
        run: |
          python -m pip install "playwright>=1.54,<2" "Pillow>=11,<13" "numpy>=1.26,<3"
          python -m playwright install --with-deps chromium
      - name: Run authentic browser SSI and render video assets
        run: python tools/export_video_hls_0163.py
      - name: Preserve actual inference values in workflow logs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('assets/video/hls_burnscar_0163/analysis.json').read_text())
          print('Sample:',a['sample_id'])
          print('Setting:',a['parameters'])
          print('GT area fraction:',a['target_area_fraction'])
          print('Positive spatial SSI weighted fraction in GT:',a['positive_spatial_ssi_weighted_fraction_inside_GT'])
          for entry in a['spectral_ranking_by_absolute_total']:
              print(entry['name'],entry['spectral_total'])
          PY
      - name: Commit genuine numerical result and video plates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video/hls_burnscar_0163/
          if git diff --cached --quiet; then
            echo "The video evidence files are unchanged"
            exit 0
          fi
          git commit -m "assets(video): publish authentic HLS 0163 SSI K5 G16 image and numerical plates"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssi-0163-video-plates
          path: assets/video/hls_burnscar_0163/
          if-no-files-found: warn
