name: Render validated HLS showcase
on:
  push:
    paths:
      - ".github/workflows/render-hls-showcase.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "matplotlib>=3.8,<4"
      - name: Verify signed SSI and render faithful PNG
        run: python tools/render_hls_showcase.py
      - name: Commit the generated image to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/HLS_BurnScars/sample_0163_mean_g16_k5.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: export authentic HLS G16 K5 Atlas PNG with positive SWIR1 and SWIR2"
            git push origin HEAD:fix/hls-burn-swir-aligned-20261020
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verified-hls-swir-atlas
          path: examples/HLS_BurnScars/sample_0163_mean_g16_k5.png
          if-no-files-found: error
