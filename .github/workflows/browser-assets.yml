name: Build real browser SSI assets

on:
  push:
    paths:
      - 'tools/export_web_hls.py'
      - '.github/workflows/browser-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install ONNX validation and image libraries
        run: python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 pillow==11.1.0
      - name: Export and independently verify the real model in ONNX
        run: python tools/export_web_hls.py
      - name: Commit reproducible browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/playground/assets/
          git diff --cached --quiet && exit 0
          git commit -m "assets(browser): publish reproducible HLS ONNX and model input"
          git push origin HEAD:main
