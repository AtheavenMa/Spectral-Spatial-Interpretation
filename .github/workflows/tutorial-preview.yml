name: Refresh SSI Tutorial Preview

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/tutorial.css"
      - "docs/tutorial.js"
      - "docs/assets/ssi-tour/**"
      - "tools/render_tutorial_preview.py"
      - ".github/workflows/tutorial-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install screenshot tools
        run: |
          python -m pip install "playwright>=1.54,<2" "Pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Capture the real three-slide tutorial preview
        run: python tools/render_tutorial_preview.py
      - name: Test progressive order contributions
        run: python tools/test_tutorial_order_accumulation.py
      - name: Commit preview screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tour_preview.png
          if git diff --cached --quiet; then
            echo "Preview unchanged"
            exit 0
          fi
          git commit -m "assets(tutorial): refresh three-slide SAR-style preview"
          git push origin HEAD:main
