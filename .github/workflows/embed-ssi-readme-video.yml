name: Embed the existing SSI video in README

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/embed-ssi-readme-video.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify the ordinary MP4 stored in the repository
        run: |
          echo "26939d89fd8fcc0811e655131084e079b5cb32f2a0203c5c8df102952adc1f67  assets/video/SSI_video_github.mp4" | sha256sum --check
          test "$(wc -c < assets/video/SSI_video_github.mp4)" -eq 8139836
          grep -Fq '[🎞️ SSI Video (MP4)](https://github.com/AtheavenMa/Spectral-Spatial-Interpretation/blob/main/assets/video/SSI_video.mp4)' README.md

      - name: Upload the existing MP4 as a native GitHub video attachment
        shell: bash
        run: |
          set -euo pipefail
          issue_url="$(gh issue create \
            --title 'SSI README video attachment' \
            --body 'This automatically created issue stores the native GitHub video attachment for inline playback in README.md.' \
            --attach assets/video/SSI_video_github.mp4)"
          issue_number="${issue_url##*/}"
          echo "ISSUE_NUMBER=$issue_number" >> "$GITHUB_ENV"
          gh issue view "$issue_number" --json body --jq '.body' > /tmp/ssi_video_body.txt
          video_url="$(grep -Eo 'https://github.com/user-attachments/assets/[0-9A-Za-z-]+' /tmp/ssi_video_body.txt | head -n 1)"
          test -n "$video_url"
          echo "VIDEO_URL=$video_url" >> "$GITHUB_ENV"
          echo "Uploaded GitHub video attachment: $video_url"

      - name: Replace plain MP4 link with native inline player
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          original = "[🎞️ SSI Video (MP4)](https://github.com/AtheavenMa/Spectral-Spatial-Interpretation/blob/main/assets/video/SSI_video.mp4)"
          video_url = os.environ["VIDEO_URL"]
          assert s.count(original) == 1
          assert video_url.startswith("https://github.com/user-attachments/assets/")
          s = s.replace(original, video_url, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: embed GitHub-hosted SSI video directly in README'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Close media-storage issue after publishing
        if: success()
        run: |
          gh issue close "$ISSUE_NUMBER" --comment 'The uploaded media is now embedded directly in the repository README.'
