name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and web test dependencies
        run: python -m pip install -r requirements_lab_test.txt
      - name: Unit and real-checkpoint integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: node --check lab/static/app.js
      - name: Validate cloud launch configuration
        run: |
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          bash -n .devcontainer/start.sh
  docker-smoke:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU Docker image
        run: docker build -t ssi-lab-smoke .
      - name: Start the SSI API
        run: docker run -d --name ssi-lab-smoke -p 7860:7860 ssi-lab-smoke
      - name: Smoke test deployed API and real inference
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/health > /tmp/ssi_health.json; then break; fi
            sleep 2
          done
          python -c 'import json; d=json.load(open("/tmp/ssi_health.json")); assert d["model_ready"] and d["sample_ready"]'
          curl --fail-with-body -sS -X POST http://127.0.0.1:7860/api/explain \
            -H 'Content-Type: application/json' \
            -d '{"grid":4,"method":"permutation","permutations":1}' > /tmp/ssi_explain.json
          python -c 'import json; d=json.load(open("/tmp/ssi_explain.json")); assert len(d["attribution"]) == 4; assert len(d["attribution"][0][0]) == 6; assert d["local_efficiency_error"] < 1e-5'
      - name: Browser interaction and responsive layout smoke test
        run: |
          python -m pip install "playwright>=1.54,<2"
          python -m playwright install --with-deps chromium
          python lab/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssi-playground-browser
          path: |
            /tmp/ssi_playground_desktop.png
            /tmp/ssi_playground_mobile.png
          if-no-files-found: ignore
      - name: Show server logs on failure
        if: failure()
        run: docker logs ssi-lab-smoke
